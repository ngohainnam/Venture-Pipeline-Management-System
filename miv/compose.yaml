services:
  frontend:
    build:
      context: .
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-development-only-change-me}
      DATABASE_URL: ${DATABASE_URL:-file:./dev.db}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://host.docker.internal:3001}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://host.docker.internal:3001}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npm install
      && npm run db:generate
      && npm run db:push
      && npm run db:seed
      && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
    name: vpms_frontend_node_modules
  frontend_next:
    name: vpms_frontend_next
